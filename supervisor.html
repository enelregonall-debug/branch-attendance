<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Katrinas Digital Attendance — Supervisor</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#eef2f7,#f8fafc);font-family:"Book Antiqua",Palatino,serif;color:#172033}.box{width:min(430px,100%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 20px 50px rgba(23,32,51,.16)}.brand{font-size:14px;font-weight:700;color:#8d1023;margin-bottom:18px}h2{margin:0 0 10px;color:#8d1023}p{color:#667085}input,button{width:100%;padding:12px;border-radius:10px;font:inherit;margin-top:10px}input{border:1px solid #d7dce5}button{border:0;background:#8d1023;color:#fff;font-weight:700}.secondary{background:#fff;color:#172033;border:1px solid #ccd3df}.msg{min-height:24px;margin-top:12px;font-size:14px}.bad{color:#b42318;font-weight:700}.ok{color:#087443;font-weight:700}</style></head><body><div class="box"><div class="brand">KATRINAS DIGITAL ATTENDANCE</div><h2>Supervisor Sign In</h2><p>Full back-office access: Employees, Branch QR, Attendance and Monthly Summary.</p><input id="email" type="email" placeholder="Supervisor email" autocomplete="username"><input id="password" type="password" placeholder="Supervisor password" autocomplete="current-password"><button id="loginBtn" onclick="login()">🔐 Sign In</button><button class="secondary" onclick="signup()">Create Supervisor Account</button><button class="secondary" onclick="resend()">Resend Confirmation Email</button><div id="msg" class="msg"></div></div><script>
const U="https://ktrrjldiniwqryuojjnq.supabase.co",K="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK",AUTH=U+"/auth/v1";
const msg=()=>document.getElementById("msg");
async function login(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,btn=document.getElementById("loginBtn");if(!email||!password){msg().innerHTML='<span class="bad">Enter email and password.</span>';return}btn.disabled=true;msg().textContent="Signing in…";try{const r=await fetch(AUTH+"/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":K},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||d.message||"Invalid login credentials");const role=d.user?.user_metadata?.role||"supervisor";if(role==="boss"){throw new Error("This is the Employer / Owner account. Please use the Employer login.")}sessionStorage.setItem("kda_access_token",d.access_token||"");sessionStorage.setItem("kda_refresh_token",d.refresh_token||"");location.replace("./index.html")}catch(e){msg().innerHTML='<span class="bad">❌ '+String(e.message||e)+'</span>';btn.disabled=false}}
async function signup(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;if(!email||password.length<6){msg().innerHTML='<span class="bad">Enter an email and password with at least 6 characters.</span>';return}msg().textContent="Creating account…";try{const r=await fetch(AUTH+"/signup",{method:"POST",headers:{"Content-Type":"application/json","apikey":K},body:JSON.stringify({email,password,data:{role:"supervisor"}})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||"Could not create account");msg().innerHTML=d.access_token?'<span class="ok">✅ Account created. Opening Supervisor Browser…</span>':'<span class="ok">✅ Account created. Check your email for confirmation.</span>';if(d.access_token){sessionStorage.setItem("kda_access_token",d.access_token);sessionStorage.setItem("kda_refresh_token",d.refresh_token||"");setTimeout(()=>location.replace("./index.html"),300)}}catch(e){msg().innerHTML='<span class="bad">❌ '+String(e.message||e)+'</span>'}}
async function resend(){const email=document.getElementById("email").value.trim();if(!email){msg().innerHTML='<span class="bad">Enter your supervisor email first.</span>';return}msg().textContent="Sending confirmation email…";try{const r=await fetch(AUTH+"/resend",{method:"POST",headers:{"Content-Type":"application/json","apikey":K},body:JSON.stringify({type:"signup",email})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||"Could not resend confirmation");msg().innerHTML='<span class="ok">✅ Confirmation email sent. Check Inbox and Spam/Junk.</span>'}catch(e){msg().innerHTML='<span class="bad">❌ '+String(e.message||e)+'</span>'}}
</script></body></html>
