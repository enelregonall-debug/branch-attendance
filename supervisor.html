 .layout{display:block}.sidebar{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;border-right:0;border-bottom:1px solid var(--border)}

input,.custom-select{background:var(--card);color:var(--text);border-color:var(--border)}

<script>

async function render(page){

      <div id="qrStatus" class="panel">Loading branches…</div>
      <div id="qrGrid" class="qr-grid"></div>`;

        </div>
        <div id="attStatus" style="color:var(--muted)">Loading attendance…</div>
      </div>
      <div id="attTableWrap" class="att-table-wrap"></div>
`;

      <div class="panel">
        <div class="att-tools">
          <select id="manualBranch"><option value="">Select Branch</option></select>

const CUSTOM_THEMES={clean:["Clean Professional","#1f4e79","#f4f6f8","#fff","#17202a"],katrinas:["Katrinas Blue","#0b63ce","#eef6ff","#fff","#14213d"],navy:["Navy Executive","#17324d","#eef1f5","#fff","#16212b"],sky:["Sky Blue","#168aad","#edf9fc","#fff","#12343b"],royal:["Royal Blue","#3155c6","#f1f3ff","#fff","#18203b"],emerald:["Emerald Green","#087f5b","#eefaf5","#fff","#14352c"],teal:["Modern Teal","#087f8c","#effafb","#fff","#12363a"],purple:["Royal Purple","#6841d8","#f6f2ff","#fff","#251b3b"],violet:["Violet Glow","#7c3aed","#f7f3ff","#fff","#27163e"],rose:["Rose Pink","#be185d","#fff4f8","#fff","#3b1727"],orange:["Sunset Orange","#c2410c","#fff7ed","#fff","#3b2115"],amber:["Warm Amber","#a16207","#fffbeb","#fff","#3a2d0b"],dark:["Midnight Dark","#60a5fa","#111827","#1f2937","#f3f4f6"],slate:["Slate Modern","#475569","#f1f5f9","#fff","#1e293b"],glass:["Glass Modern","#2563eb","#eaf2ff","#fff","#172033"],minimal:["Minimalist","#111827","#fafafa","#fff","#111827"],classic:["Classic Office","#334155","#f5f3ef","#fffdf8","#292524"],pastel:["Soft Pastel","#64748b","#f8f5ff","#fff","#293044"],bold:["Bold Corporate","#111827","#eef2f7","#fff","#111827"],luxury:["Luxury Navy & Gold","#c9a227","#111827","#1b2433","#f8fafc"],nature:["Nature Green","#3f6212","#f3f8ed","#fff","#23320f"],katrinasCustom:["Katrinas Custom","#8b5e34","#fffaf2","#fffdf8","#33261d"]};
const CUSTOM_FONTS=["Arial","Book Antiqua","Inter","Poppins","Roboto","Helvetica","Open Sans","Lato","Montserrat","Nunito","Raleway","Ubuntu","Oswald","Merriweather","Playfair Display","Roboto Slab"];
function applyCustomTheme(k){const t=CUSTOM_THEMES[k]||CUSTOM_THEMES.clean,r=document.documentElement;r.style.setProperty("--primary",t[1]);r.style.setProperty("--bg",t[2]);r.style.setProperty("--card",t[3]);r.style.setProperty("--text",t[4]);r.style.setProperty("--topbar-bg",t[1]);r.style.setProperty("--accent-soft",t[2]);r.style.setProperty("--table-head",t[2]);localStorage.setItem("katrinasTheme",k);}
function applyCustomFont(f){const stack=f==="Book Antiqua"?"Book Antiqua,Palatino,serif":f+",Arial,Helvetica,sans-serif";document.documentElement.style.setProperty("--app-font",stack);document.body.style.fontFamily=stack;document.querySelectorAll(".app,.topbar,.sidebar,.navbtn,.content,.card,.panel,.att-table,.emp-table,.modal,.theme-choice,input,select,button").forEach(el=>el.style.fontFamily=stack);localStorage.setItem("katrinasFont",f);}
function initCustomSettings(){const g=document.getElementById("themeGrid"),s=document.getElementById("fontSelect"),save=document.getElementById("saveCustomBtn"),msg=document.getElementById("customSaveMsg");if(!g||!s)return;g.innerHTML=Object.entries(CUSTOM_THEMES).map(([k,t])=>'<button type="button" class="theme-choice" data-theme="'+k+'"><div class="theme-swatch" style="--sw1:'+t[1]+';--sw2:'+t[2]+'"></div><b>'+t[0]+'</b></button>').join("");s.innerHTML=CUSTOM_FONTS.map(f=>'<option>'+f+'</option>').join("");const tk=localStorage.getItem("katrinasTheme")||"clean",fk=localStorage.getItem("katrinasFont")||"Arial";let pendingTheme=tk,pendingFont=fk;s.value=fk;document.getElementById("themeCurrent").textContent=CUSTOM_THEMES[tk][0];document.getElementById("fontCurrent").textContent=fk;g.querySelectorAll(".theme-choice").forEach(b=>{b.classList.toggle("selected",b.dataset.theme===tk);b.onclick=()=>{pendingTheme=b.dataset.theme;document.getElementById("themeCurrent").textContent=CUSTOM_THEMES[pendingTheme][0];g.querySelectorAll(".theme-choice").forEach(x=>x.classList.remove("selected"));b.classList.add("selected")}});s.onchange=()=>{pendingFont=s.value;document.getElementById("fontCurrent").textContent=pendingFont};if(save)save.onclick=()=>{applyCustomTheme(pendingTheme);applyCustomFont(pendingFont);msg.textContent="✓ Changes saved and applied to the whole Back Office.";setTimeout(()=>msg.textContent="",2500)};applyCustomTheme(tk);applyCustomFont(fk);}
function loadSavedCustomSettings(){applyCustomTheme(localStorage.getItem("katrinasTheme")||"clean");applyCustomFont(localStorage.getItem("katrinasFont")||"Arial");}
function phDate(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
let attendanceRows=[];
let attendanceBranches=[];
function setManualDateLimits(){
  const month=document.getElementById("manualMonth").value,date=document.getElementById("manualDate");
  if(!month)return;
  const [y,m]=month.split("-").map(Number);
  const min=y+"-"+String(m).padStart(2,"0")+"-01";
  const max=new Date(y,m,0).toISOString().slice(0,10);
  date.min=min;date.max=max;
  if(!date.value||date.value<min||date.value>max)date.value=min;

function manualDateTimeLocal(date,time){return new Date(date+'T'+time+':00').toISOString()}
async function saveManualAttendance(){
  const branch=document.getElementById("manualBranch")?.value;
  const emp=document.getElementById("manualEmployee")?.value;
  const date=document.getElementById("manualDate")?.value;
  const type=document.getElementById("manualType")?.value||"full";
  const timeIn=document.getElementById("manualTimeIn")?.value||"";
  const timeOut=document.getElementById("manualTimeOut")?.value||"";
  if(!branch||!emp||!date||!timeIn||!timeOut){setManualMsg("Please select Branch, Employee, Date, Time In and Time Out.",false);return}
  if(timeOut<=timeIn){setManualMsg("Time Out must be later than Time In.",false);return}
  const save=document.getElementById("manualSave");
  save.disabled=true;save.textContent="Saving…";setManualMsg("",true);
  try{
    const {data:employees,error:ee}=await sb.from("employees").select("id,employee_code,full_name,branch_id").eq("id",emp).eq("active",true).limit(1);
    if(ee)throw ee;
    const e=employees?.[0];if(!e)throw new Error("Employee not found.");
    const {data:existing,error:xe}=await sb.from("attendance").select("id").eq("employee_id",emp).eq("attendance_date",date).limit(1);
    if(xe)throw xe;
    const payload={employee_id:Number(e.id),branch_id:Number(branch),attendance_date:date,time_in:manualDateTimeLocal(date,timeIn),time_out:manualDateTimeLocal(date,timeOut)};
    if(existing?.[0]){
      const {error}=await sb.from("attendance").update({branch_id:payload.branch_id,time_in:payload.time_in,time_out:payload.time_out}).eq("id",existing[0].id);
      if(error)throw error;
    }else{
      const {error}=await sb.from("attendance").insert(payload);
      if(error)throw error;
    }
    setManualMsg("✅ Manual attendance saved for "+e.full_name+" — "+(type==="half"?"HALF DAY":"WHOLE DAY")+".",true);
    await loadManualExisting();
  }catch(e){setManualMsg("❌ Save failed: "+(e?.message||e),false)}
  finally{save.disabled=false;save.textContent="💾 Save Manual Attendance"}
}

async function loadMonthlySummary(){
  const monthEl=document.getElementById("msMonth"), branchEl=document.getElementById("msBranch");
  const status=document.getElementById("msStatus"), wrap=document.getElementById("msTableWrap");
  if(!monthEl||!branchEl)return;
  monthEl.value=monthEl.value||phDate().slice(0,7);
  try{
    const [{data:employees,error:ee},{data:branches,error:be}]=await Promise.all([
      sb.from("employees").select("id,employee_code,full_name,branch_id,daily_rate,active").eq("active",true).order("employee_code"),
      sb.from("branches").select("id,name").order("name")
    ]);
    if(ee)throw ee;if(be)throw be;
    const bs=branches||[], emps=employees||[];
    branchEl.innerHTML='<option value="">All Branches</option><option value="any">Any Branch</option>'+bs.map(b=>'<option value="'+escText(b.id)+'">'+escText(b.name)+'</option>').join('');
    await fetchMonthlySummary();
    monthEl.onchange=fetchMonthlySummary;
    branchEl.onchange=fetchMonthlySummary;
    document.getElementById("msRefresh").onclick=fetchMonthlySummary;

    async function fetchMonthlySummary(){
      const month=monthEl.value||phDate().slice(0,7), filter=branchEl.value||"";
      status.textContent="Loading monthly spreadsheet…"; wrap.innerHTML="";
      const [y,m]=month.split("-").map(Number), days=new Date(y,m,0).getDate();
      const todayKey=phDate();
      const currentMonthKey=todayKey.slice(0,7);
      const {data:att,error:ae}=await sb.from("attendance")
        .select("employee_id,attendance_date,time_in,time_out")
        .gte("attendance_date",month+"-01")
        .lte("attendance_date",month+"-"+String(days).padStart(2,"0"));
      if(ae)throw ae;

      const rows=emps.filter(e=>{
        const bid=String(e.branch_id??"");
        return !filter||(filter==="any"?bid==="":bid===filter);
      }).map(e=>{
        const mine=(att||[]).filter(a=>String(a.employee_id)===String(e.id));
        const daily={};
        mine.forEach(a=>{daily[a.attendance_date]=a});
        const marks=[];
        let present=0;
        for(let d=1;d<=31;d++){
          if(d>days){ marks.push("—"); continue; }
          const key=month+"-"+String(d).padStart(2,"0");
          if(month===currentMonthKey && key>todayKey){ marks.push("—"); continue; }
          const a=daily[key];
          let mark="";
          if(a?.time_in&&a?.time_out){
            const tin=new Date(a.time_in), tout=new Date(a.time_out);
            const hours=(tout-tin)/3600000;
            if(hours>0 && hours<=6){ present+=0.5; mark="½"; }
            else { present+=1; mark="✓"; }
          }else if(a?.time_in){
            present+=1; mark="✓";
          }else{
            mark="✗";
          }
          marks.push(mark);
        }
        const selectedMonthKey=month;
        const elapsedDays=selectedMonthKey<currentMonthKey?31:(selectedMonthKey>currentMonthKey?0:Number(todayKey.slice(8)));
        const absent=Math.max(0,elapsedDays-present);
        const pay=Number(e.daily_rate||0)*present;
        return {e,marks,present,absent,pay};
      });

      status.textContent=rows.length+" employee(s) shown. Spreadsheet view.";
      const dayHeads=Array.from({length:31},(_,i)=>'<th style="text-align:center;min-width:42px">'+(i+1)+'</th>').join("");
      wrap.innerHTML=
        '<table class="att-table monthly-sheet" style="min-width:1900px">'+
        '<thead><tr><th class="freeze-left">EMP ID</th><th class="freeze-left-2">NAME</th><th>BRANCH</th><th>SCHEDULED</th>'+
        dayHeads+
        '<th>TOTAL PRESENT</th><th>TOTAL ABSENT</th><th>ESTIMATED PAY</th></tr></thead>'+
        '<tbody>'+rows.map(r=>{
          const b=bs.find(x=>String(x.id)===String(r.e.branch_id));
          const dayCells=r.marks.map(mark=>'<td style="text-align:center;font-weight:700;font-family:Arial,Helvetica,sans-serif">'+String(mark).replace('✓','&#10003;').replace('✗','&#10007;')+'</td>').join("");
          return '<tr><td class="freeze-left"><b>'+escText(r.e.employee_code)+'</b></td>'+
            '<td class="freeze-left-2">'+escText(r.e.full_name)+'</td>'+
            '<td>'+escText(b?.name||"Any Branch")+'</td><td><b>31</b></td>'+dayCells+
            '<td><b>'+r.present+'</b></td><td><b>'+r.absent+'</b></td>'+
            '<td><b>₱'+r.pay.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2})+'</b></td></tr>';
        }).join("")+'</tbody></table>'+
        '<div style="margin-top:10px;color:var(--muted);font-size:13px"><b>Legend:</b> ✓ = Present &nbsp; ✗ = Absent &nbsp; ½ = Half Day &nbsp; — = Upcoming / date not in selected month. &nbsp; Scheduled payroll basis = 31 days.</div>';
    }
  }catch(e){status.textContent="Could not load monthly summary: "+(e?.message||e)}
}

async function loadDashboard(){
  const status=document.getElementById("dashStatus");
  try{
    const [{data:employees,error:ee},{data:branches,error:be},{data:attendance,error:ae}]=await Promise.all([
      sb.from("employees").select("id").eq("active",true),
      sb.from("branches").select("id"),
      sb.from("attendance").select("employee_id,time_in").eq("attendance_date",phDate())
    ]);
    if(ee) throw ee; if(be) throw be; if(ae) throw ae;
    const presentIds=new Set((attendance||[]).filter(x=>x.time_in).map(x=>x.employee_id));
    document.getElementById("dashEmployees").textContent=(employees||[]).length;
    document.getElementById("dashBranches").textContent=(branches||[]).length;
    document.getElementById("dashPresent").textContent=presentIds.size;
    document.getElementById("dashAbsent").textContent=Math.max(0,(employees||[]).length-presentIds.size);
    status.textContent="Live data loaded for "+phDate()+".";
    document.getElementById("refreshDashboard").onclick=loadDashboard;
  }catch(e){
    status.textContent="Could not load live data: "+(e?.message||e);
    ["dashEmployees","dashBranches","dashPresent","dashAbsent"].forEach(id=>document.getElementById(id).textContent="—");
  }
}
async function openApp(session){
  loginView.classList.add("hidden");
  appView.classList.remove("hidden");
  signedUser.textContent=session.user.email||"Supervisor";
  await render("dashboard");
}
async function checkSession(){
  const {data,error}=await sb.auth.getSession();
  if(error){console.error(error);return}
  if(data.session) await openApp(data.session);
}
document.getElementById("loginBtn").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email||!password){showMessage("Please enter email and password.");return}
  const btn=document.getElementById("loginBtn");
  btn.disabled=true; btn.textContent="Signing in...";
  showMessage("");
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){showMessage(error.message);return}
    const {data:check}=await sb.auth.getSession();
    if(!check.session){showMessage("Login succeeded but no session was created.");return}
    showMessage("Login successful.",true);
    await openApp(check.session);
  }catch(e){showMessage(e?.message||String(e))}
  finally{btn.disabled=false;btn.textContent="LOGIN"}
};
document.getElementById("logoutBtn").onclick=async()=>{
  await sb.auth.signOut();
  appView.classList.add("hidden");
  loginView.classList.remove("hidden");
  document.getElementById("password").value="";
  showMessage("");
};
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=async()=>await render(b.dataset.page));
// Restore the last saved Custom Theme and Font on every page refresh.
loadSavedCustomSettings();

const layout=document.querySelector(".layout");
const sidebarToggle=document.getElementById("sidebarToggle");
sidebarToggle.onclick=()=>{layout.classList.toggle("sidebar-collapsed");sidebarToggle.textContent=layout.classList.contains("sidebar-collapsed")?"":"‹";};
checkSession();
</script>
