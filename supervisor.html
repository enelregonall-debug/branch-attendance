<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katrinas Digital Attendance — Supervisor</title>
<style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}header{background:#8d1023;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:20px}.card{background:white;border:1px solid #e6eaf0;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 8px 25px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:28px;font-weight:bold}button{padding:10px 14px;border:0;border-radius:9px;background:#172033;color:white;cursor:pointer;font-weight:bold}.logout{float:right;background:white;color:#8d1023}.ok{color:#087443}.bad{color:#b42318}.muted{color:#667085}</style></head>
<body><header><button class="logout" id="logout">Log Out</button><h2>📊 Katrinas Digital Attendance</h2><div>Supervisor Back Office</div></header>
<main><div id="status" class="card">Checking Supervisor session…</div><div id="dashboard" style="display:none"><div class="card"><h2>Dashboard</h2><div class="grid"><div><div class="muted">Employees</div><div class="stat" id="employees">—</div></div><div><div class="muted">Branches</div><div class="stat" id="branches">—</div></div><div><div class="muted">Today's Attendance</div><div class="stat" id="attendance">—</div></div></div></div><div class="card"><h3>System Status</h3><p class="ok">● Supabase Connected</p><p class="ok">● Supervisor Session Active</p><p class="muted" id="account"></p></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL="https://ktrrjldiniwqryuojjnq.supabase.co",KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK",sb=supabase.createClient(URL,KEY),status=document.getElementById("status");
async function start(){try{const {data,error}=await sb.auth.getSession();if(error||!data.session){location.href="supervisor-login-test.html";return}status.innerHTML='<span class="ok">✅ Supervisor Login Verified</span>';document.getElementById("account").textContent="Signed in as: "+(data.session.user.email||"Supervisor");document.getElementById("dashboard").style.display="block";const h={apikey:KEY,Authorization:"Bearer "+data.session.access_token};const [e,b,a]=await Promise.all([fetch(URL+"/rest/v1/employees?select=id&active=eq.true",{headers:h}),fetch(URL+"/rest/v1/branches?select=id",{headers:{apikey:KEY,Authorization:"Bearer "+KEY}}),fetch(URL+"/rest/v1/attendance?select=id&attendance_date=eq."+new Date().toISOString().slice(0,10),{headers:h})]);document.getElementById("employees").textContent=e.ok?(await e.json()).length:"—";document.getElementById("branches").textContent=b.ok?(await b.json()).length:"—";document.getElementById("attendance").textContent=a.ok?(await a.json()).length:"—"}catch(err){status.innerHTML='<span class="bad">❌ '+(err.message||err)+'</span>'}}document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.href="supervisor-login-test.html"};start();
</script></body></html>
