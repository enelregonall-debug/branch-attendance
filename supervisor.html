<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katrinas Digital Attendance — Supervisor Browser</title>
<style>
:root{--primary:#1f4e79;--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#667085;--border:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
.hidden{display:none!important}
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:min(420px,100%);background:var(--card);border:1px solid var(--border);border-radius:18px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.logo{font-size:26px;font-weight:800;color:var(--primary);margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:24px}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #cfd5dc;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer}
.login-btn{width:100%;margin-top:18px;background:var(--primary);color:#fff}
#msg{margin-top:14px;min-height:20px;font-size:14px}
.app{min-height:100vh}
.topbar{background:var(--primary);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:20px;font-weight:800}
.userbox{display:flex;align-items:center;gap:10px;font-size:13px}
.logout{background:#fff;color:var(--primary);padding:8px 12px}
.layout{display:flex;min-height:calc(100vh - 62px)}
.sidebar{width:230px;background:#fff;border-right:1px solid var(--border);padding:16px}
.navbtn{display:block;width:100%;text-align:left;background:transparent;color:var(--text);margin:4px 0;padding:12px 13px}
.navbtn.active,.navbtn:hover{background:#eaf2f8;color:var(--primary)}
.content{flex:1;padding:22px;min-width:0}
.page-title{font-size:25px;font-weight:800;margin:0 0 6px}
.page-sub{color:var(--muted);margin:0 0 20px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px}
.card h3{margin:0 0 8px;font-size:14px;color:var(--muted)}
.card .num{font-size:28px;font-weight:800}.refresh{background:#fff;color:var(--primary);border:1px solid var(--border);padding:8px 12px}
.panel{margin-top:18px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:20px}
.theme-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid var(--border)}
.theme-row:last-child{border-bottom:0}
@media(max-width:800px){
 .layout{display:block}.sidebar{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:4px;border-right:0;border-bottom:1px solid var(--border)}
 .cards{grid-template-columns:repeat(2,minmax(130px,1fr))}
 .content{padding:16px}
}
</style>
</head>
<body>
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="logo">Katrinas Digital Attendance</div>
    <div class="sub">Supervisor Browser</div>
    <label for="email">Supervisor Email</label>
    <input id="email" type="email" autocomplete="username" placeholder="Enter email">
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Enter password">
    <button id="loginBtn" class="login-btn">LOGIN</button>
    <div id="msg"></div>
  </div>
</div>

<div id="appView" class="app hidden">
  <header class="topbar">
    <div class="brand">Katrinas Digital Attendance</div>
    <div class="userbox"><span id="signedUser"></span><button id="logoutBtn" class="logout">Logout</button></div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <button class="navbtn active" data-page="dashboard">Dashboard</button>
      <button class="navbtn" data-page="employees">Employees</button>
      <button class="navbtn" data-page="attendance">Attendance</button>
      <button class="navbtn" data-page="monthly">Monthly Summary</button>
      <button class="navbtn" data-page="custom">Custom</button>
    </aside>
    <main id="content" class="content"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ktrrjldiniwqryuojjnq.supabase.co";
const SUPABASE_KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const loginView=document.getElementById("loginView");
const appView=document.getElementById("appView");
const msg=document.getElementById("msg");
const content=document.getElementById("content");
const signedUser=document.getElementById("signedUser");

function showMessage(text,ok=false){
  msg.textContent=text;
  msg.style.color=ok?"#167a3d":"#b42318";
}
async function render(page){
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  if(page==="dashboard"){
    content.innerHTML=`
      <h1 class="page-title">Dashboard</h1>
      <p class="page-sub">Supervisor overview</p>
      <div class="cards">
        <div class="card"><h3>Active Employees</h3><div id="dashEmployees" class="num">…</div></div>
        <div class="card"><h3>Branches</h3><div id="dashBranches" class="num">…</div></div>
        <div class="card"><h3>Present Today</h3><div id="dashPresent" class="num">…</div></div>
        <div class="card"><h3>Absent Today</h3><div id="dashAbsent" class="num">…</div></div>
      </div>
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <strong>Today’s Overview</strong><button id="refreshDashboard" class="refresh">Refresh</button>
        </div>
        <p id="dashStatus" style="color:var(--muted)">Loading live data…</p>
      </div>`;
    await loadDashboard();
  }else if(page==="employees"){
    content.innerHTML=`<h1 class="page-title">Employees</h1><p class="page-sub">Employee roster and management.</p><div class="panel">Employee module — next step.</div>`;
  }else if(page==="attendance"){
    content.innerHTML=`<h1 class="page-title">Attendance</h1><p class="page-sub">Attendance records and management.</p><div class="panel">Attendance module — next step.</div>`;
  }else if(page==="monthly"){
    content.innerHTML=`<h1 class="page-title">Monthly Summary</h1><p class="page-sub">Present, absent and estimated pay.</p><div class="panel">Monthly Summary module — next step.</div>`;
  }else{
    content.innerHTML=`
      <h1 class="page-title">Custom</h1>
      <p class="page-sub">Theme settings for the Supervisor Browser.</p>
      <div class="panel">
        <div class="theme-row"><strong>Theme</strong><span>Clean Professional</span></div>
        <div class="theme-row"><strong>Primary Color</strong><span>Supervisor Blue</span></div>
        <div class="theme-row"><strong>Layout</strong><span>Sidebar + Browser</span></div>
      </div>`;
  }
}

function phDate(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+day;
}
async function loadDashboard(){
  const status=document.getElementById("dashStatus");
  try{
    const [{data:employees,error:ee},{data:branches,error:be},{data:attendance,error:ae}]=await Promise.all([
      sb.from("employees").select("id").eq("active",true),
      sb.from("branches").select("id"),
      sb.from("attendance").select("employee_id,time_in").eq("attendance_date",phDate())
    ]);
    if(ee) throw ee; if(be) throw be; if(ae) throw ae;
    const presentIds=new Set((attendance||[]).filter(x=>x.time_in).map(x=>x.employee_id));
    document.getElementById("dashEmployees").textContent=(employees||[]).length;
    document.getElementById("dashBranches").textContent=(branches||[]).length;
    document.getElementById("dashPresent").textContent=presentIds.size;
    document.getElementById("dashAbsent").textContent=Math.max(0,(employees||[]).length-presentIds.size);
    status.textContent="Live data loaded for "+phDate()+".";
    document.getElementById("refreshDashboard").onclick=loadDashboard;
  }catch(e){
    status.textContent="Could not load live data: "+(e?.message||e);
    ["dashEmployees","dashBranches","dashPresent","dashAbsent"].forEach(id=>document.getElementById(id).textContent="—");
  }
}
async function openApp(session){
  loginView.classList.add("hidden");
  appView.classList.remove("hidden");
  signedUser.textContent=session.user.email||"Supervisor";
  await render("dashboard");
}
async function checkSession(){
  const {data,error}=await sb.auth.getSession();
  if(error){console.error(error);return}
  if(data.session) await openApp(data.session);
}
document.getElementById("loginBtn").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  if(!email||!password){showMessage("Please enter email and password.");return}
  const btn=document.getElementById("loginBtn");
  btn.disabled=true; btn.textContent="Signing in...";
  showMessage("");
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){showMessage(error.message);return}
    const {data:check}=await sb.auth.getSession();
    if(!check.session){showMessage("Login succeeded but no session was created.");return}
    showMessage("Login successful.",true);
    await openApp(check.session);
  }catch(e){showMessage(e?.message||String(e))}
  finally{btn.disabled=false;btn.textContent="LOGIN"}
};
document.getElementById("logoutBtn").onclick=async()=>{
  await sb.auth.signOut();
  appView.classList.add("hidden");
  loginView.classList.remove("hidden");
  document.getElementById("password").value="";
  showMessage("");
};
document.querySelectorAll(".navbtn").forEach(b=>b.onclick=async()=>await render(b.dataset.page));
checkSession();
</script>
</body>
</html>
