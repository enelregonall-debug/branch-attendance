<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Katrinas Digital Attendance</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;color:#172033}
.wrap{max-width:560px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001;margin-top:25px}
h1{font-size:23px;margin:0 0 8px}.big{font-size:18px;font-weight:700}.muted{color:#667085}
select,button{width:100%;padding:14px;border-radius:10px;border:1px solid #ccd3df;font-size:16px;box-sizing:border-box;margin-top:10px}
button{background:#172033;color:#fff;border:0;font-weight:700}.secondary{background:#fff;color:#172033;border:1px solid #ccd3df}
.msg{margin-top:14px;padding:10px;border-radius:10px;background:#f5f7fa}.ok{color:#087443}.bad{color:#b42318}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>📍 Katrinas Digital Attendance</h1>
<p id="branch" class="big">Loading branch…</p>
<p class="muted">Simple employee attendance</p>

<div id="setup">
<label><b>Select your name</b></label>
<select id="employee" disabled><option>Loading employees…</option></select>
<button id="registerBtn" disabled>Register This Phone</button>
</div>

<div id="attendance" class="hidden">
<p id="selected" class="big"></p>
<button id="timeInBtn">✅ TIME IN</button>
<button id="timeOutBtn">⏰ TIME OUT</button>
<button id="changeBtn" class="secondary">Change Employee / Phone</button>
</div>

<div id="msg" class="msg">Starting…</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ktrrjldiniwqryuojjnq.supabase.co";
const SUPABASE_KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEJk";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const qs=new URLSearchParams(location.search);
const branchId=qs.get("branchId");
let branch=null,employees=[],busy=false;
const DEVICE_KEY="kda_hard_device_v1";
const EMP_KEY="kda_hard_employee_v1";
const $=id=>document.getElementById(id);
function msg(t,good=false){$("msg").textContent=t;$("msg").className="msg "+(good?"ok":"bad")}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function token(){let t=localStorage.getItem(DEVICE_KEY);if(!t){t=crypto.randomUUID?crypto.randomUUID():"kda-"+Date.now()+"-"+Math.random().toString(36).slice(2);localStorage.setItem(DEVICE_KEY,t)}return t}
function distance(a,b,c,d){const R=6371000,p=Math.PI/180,A=(c-a)*p,B=(d-b)*p,x=Math.sin(A/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(B/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function position(){return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:15000,maximumAge:30000}))}

async function loadRoster(){
  if(!branchId)throw Error("Invalid branch QR. Please use the branch QR code.");
  const {data,error}=await db.rpc("employee_get_roster",{p_branch_id:Number(branchId)});
  if(error)throw error;
  if(!data?.branch)throw Error("Branch could not be verified.");
  branch=data.branch;
  employees=Array.isArray(data.employees)?data.employees:[];
  if(!employees.length)throw Error("No active employees are assigned to this branch.");
  $("branch").textContent="Branch: "+branch.name;
  $("employee").innerHTML='<option value="">Select your name</option>'+
    employees.map(e=>'<option value="'+String(e.employee_code).replace(/"/g,"&quot;")+'">'+
    String(e.full_name).replace(/</g,"&lt;")+" — "+String(e.employee_code).replace(/</g,"&lt;")+"</option>").join("");
  $("employee").disabled=false;$("registerBtn").disabled=false;
}
function show(e){$("setup").classList.add("hidden");$("attendance").classList.remove("hidden");$("selected").textContent=e.full_name+" — "+e.employee_code}
async function registerPhone(){
  if(busy)return;
  const e=employees.find(x=>x.employee_code===$("employee").value);
  if(!e){msg("Please select your name first.");return}
  busy=true;
  try{
    const {error}=await db.rpc("employee_register_device",{
      p_employee_id:Number(e.id),p_branch_id:Number(branch.id),p_device_token:token()
    });
    if(error)throw error;
    localStorage.setItem(EMP_KEY,JSON.stringify({id:e.id,employee_code:e.employee_code,full_name:e.full_name,branch_id:e.branch_id}));
    show(e);msg("Ready. You can now TIME IN.",true);
  }catch(e){msg("❌ "+(e.message||"Phone registration failed."))}
  finally{busy=false}
}
async function verifyInside(){
  if(!branch.latitude||!branch.longitude)throw Error("Branch GPS location is not set.");
  const p=await position();
  const d=distance(p.coords.latitude,p.coords.longitude,Number(branch.latitude),Number(branch.longitude));
  if(d>Number(branch.radius_m||75))throw Error("You are outside "+branch.name+".");
}
async function attendance(type){
  if(busy)return;
  busy=true;
  try{
    const e=JSON.parse(localStorage.getItem(EMP_KEY)||"null");
    if(!e)throw Error("Please register this phone first.");
    await verifyInside();
    const {error}=await db.rpc(type==="in"?"employee_time_in":"employee_time_out",{
      p_employee_id:Number(e.id),p_branch_id:Number(branch.id),
      p_device_token:token(),p_attendance_date:today(),p_time:new Date().toISOString()
    });
    if(error)throw error;
    msg("✓ "+type.toUpperCase()+" recorded successfully.",true);
    alert(type==="in"?"TIME IN successful.":"TIME OUT successful.");
  }catch(e){msg("❌ "+(e.message||"Attendance failed."))}
  finally{busy=false}
}
function changeEmployee(){localStorage.removeItem(EMP_KEY);location.reload()}
async function start(){
  try{
    msg("Connecting…");
    await loadRoster();
    const saved=JSON.parse(localStorage.getItem(EMP_KEY)||"null");
    if(saved?.id && Number(saved.branch_id)===Number(branch.id)){
      const e=employees.find(x=>Number(x.id)===Number(saved.id));
      if(e){show(e);msg("Ready — "+e.full_name+".",true);return}
    }
    msg("Select your name, then register this phone.",true);
  }catch(e){msg("❌ "+(e.message||"Could not load attendance."))}
}
$("registerBtn").onclick=registerPhone;
$("timeInBtn").onclick=()=>attendance("in");
$("timeOutBtn").onclick=()=>attendance("out");
$("changeBtn").onclick=changeEmployee;
start();
</script>
</body>
</html>
