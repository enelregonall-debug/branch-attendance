<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="kda-version" content="2026-10-08-clean-v1">
<title>Katrinas Digital Attendance</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;color:#172033}
.wrap{max-width:560px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001;margin-top:25px}
h1{font-size:23px;margin:0 0 6px}
.big{font-size:18px;font-weight:700}
.muted{color:#667085}
select,button{width:100%;padding:14px;border-radius:10px;border:1px solid #ccd3df;font-size:16px;box-sizing:border-box;margin-top:10px}
button{background:#172033;color:#fff;border:0;font-weight:700}
.secondary{background:#fff;color:#172033;border:1px solid #ccd3df}
.msg{margin-top:14px;padding:10px;border-radius:10px;background:#f5f7fa}
.ok{color:#087443}.bad{color:#b42318}.hidden{display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>📍 Katrinas Digital Attendance</h1>
<p id="branch" class="big">Checking branch…</p>
<p class="muted">Employee attendance — GPS branch check</p>

<div id="setup">
<label><b>Select your name</b></label>
<select id="employee"><option>Loading employees…</option></select>
<button id="registerBtn">Register This Phone</button>
</div>

<div id="attendance" class="hidden">
<p id="selected" class="big"></p>
<button id="timeInBtn">✅ TIME IN</button>
<button id="timeOutBtn">⏰ TIME OUT</button>
<button id="changeBtn" class="secondary">Change Employee / Phone</button>
</div>

<div id="msg" class="msg">Starting…</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ktrrjldiniwqryuojjnq.supabase.co";
const SUPABASE_KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const qs=new URLSearchParams(location.search);
const branchId=qs.get("branchId");
const branchToken=qs.get("branch");
const branchNameParam=qs.get("branchName");
const QR_VERSION=qs.get("qrVersion")||"KDA-QR-V3";
let branch=null,employees=[],busy=false;
const DEVICE_KEY="kda_simple_device_v1";
const EMP_KEY="kda_simple_employee_v1";

const $=id=>document.getElementById(id);
function msg(t,good=false){$("msg").textContent=t;$("msg").className="msg "+(good?"ok":"bad")}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function token(){let t=localStorage.getItem(DEVICE_KEY);if(!t){t=crypto.randomUUID?crypto.randomUUID():"kda-"+Date.now()+"-"+Math.random().toString(36).slice(2);localStorage.setItem(DEVICE_KEY,t)}return t}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function distance(a,b,c,d){const R=6371000,p=Math.PI/180,A=(c-a)*p,B=(d-b)*p,x=Math.sin(A/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(B/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function position(){return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(resolve,reject,{enableHighAccuracy:true,timeout:15000,maximumAge:30000}))}

async function loadBranch(){
  let q=db.from("branches").select("id,name,latitude,longitude,radius_m");
  if(branchId)q=q.eq("id",Number(branchId));
  else if(branchToken)q=q.eq("qr_token",branchToken);
  else if(branchNameParam)q=q.eq("name",branchNameParam);
  else throw Error("Branch QR information is missing.");
  const {data,error}=await q.maybeSingle();
  if(error)throw error;
  if(!data)throw Error("Branch could not be verified.");
  branch=data;$("branch").textContent="Branch: "+data.name;
}
async function loadEmployees(){
  const {data,error}=await db.from("employees").select("id,employee_code,full_name,position,branch_id").eq("active",true).or("branch_id.eq."+Number(branch.id)+",branch_id.is.null").order("full_name");
  if(error)throw error;
  if(!data?.length)throw Error("No active employees are assigned to this branch.");
  employees=data;
  $("employee").innerHTML='<option value="">Select your name</option>'+data.map(e=>'<option value="'+esc(e.employee_code)+'">'+esc(e.full_name)+" — "+esc(e.employee_code)+"</option>").join("");
}
function show(e){$("setup").classList.add("hidden");$("attendance").classList.remove("hidden");$("selected").textContent=e.full_name+" — "+e.employee_code}
async function registerPhone(){
  if(busy)return;
  const e=employees.find(x=>x.employee_code===$("employee").value);
  if(!e){msg("Please select your name first.");return}
  if(e.branch_id!=null&&Number(e.branch_id)!==Number(branch.id)){msg("This employee is not assigned to this branch.");return}
  busy=true;
  try{
    const {error}=await db.rpc("employee_register_device",{p_employee_id:Number(e.id),p_branch_id:Number(branch.id),p_device_token:token()});
    if(error)throw error;
    localStorage.setItem(EMP_KEY,JSON.stringify({id:e.id,employee_code:e.employee_code,full_name:e.full_name,branch_id:e.branch_id}));
    show(e);msg("Phone registered. Ready for attendance.",true);
  }catch(e){msg("❌ "+(e.message||"Phone registration failed."))}
  finally{busy=false}
}
async function verifyInside(){
  if(!branch.latitude||!branch.longitude)throw Error("Branch GPS location is not set yet.");
  const p=await position();
  const d=distance(p.coords.latitude,p.coords.longitude,Number(branch.latitude),Number(branch.longitude));
  if(d>Number(branch.radius_m||75))throw Error("You are outside "+branch.name+". Attendance is allowed only inside the branch.");
}
async function attendance(type){
  if(busy)return;
  busy=true;
  try{
    const e=JSON.parse(localStorage.getItem(EMP_KEY)||"null");
    if(!e)throw Error("Register this phone first.");
    if(e.branch_id!=null&&Number(e.branch_id)!==Number(branch.id))throw Error("This employee is not assigned to this branch.");
    await verifyInside();
    const now=new Date().toISOString();
    const rpc=type==="in"?"employee_time_in":"employee_time_out";
    const {error}=await db.rpc(rpc,{p_employee_id:Number(e.id),p_branch_id:Number(branch.id),p_device_token:token(),p_attendance_date:today(),p_time:now});
    if(error)throw error;
    msg("✓ "+type.toUpperCase()+" recorded successfully for "+e.full_name+".",true);
    alert(type==="in"?"TIME IN successful.":"TIME OUT successful.");
  }catch(e){msg("❌ "+(e.message||"Attendance could not be recorded."))}
  finally{busy=false}
}
function changeEmployee(){localStorage.removeItem(EMP_KEY);location.reload()}
async function start(){
  try{
    await loadBranch();await loadEmployees();
    const saved=JSON.parse(localStorage.getItem(EMP_KEY)||"null");
    if(saved?.id){show(saved);msg("Ready — "+saved.full_name+".",true)}
    else msg("Select your name to register this phone.",true);
  }catch(e){msg("❌ "+(e.message||"Could not load attendance."))}
}
$("registerBtn").onclick=registerPhone;
$("timeInBtn").onclick=()=>attendance("in");
$("timeOutBtn").onclick=()=>attendance("out");
$("changeBtn").onclick=changeEmployee;
start();
</script>
</body>
</html>
