<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Katrinas Digital Attendance — Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef2f7,#f8fafc);font-family:Arial,Helvetica,sans-serif;color:#172033;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(460px,100%);background:#fff;padding:30px;border-radius:20px;border:1px solid #e6eaf0;box-shadow:0 20px 50px rgba(23,32,51,.16)}
.icon{font-size:40px}.muted{color:#667085}.small{font-size:13px}.msg{min-height:22px;margin-top:12px}.bad{color:#b42318;font-weight:700}.ok{color:#087443;font-weight:700}
input,button{width:100%;padding:13px 14px;border-radius:11px;font:inherit}input{border:1px solid #d7dce5;margin:7px 0 10px}button{border:0;background:#172033;color:#fff;cursor:pointer;font-weight:700;margin-top:8px}button.alt{background:#fff;color:#172033;border:1px solid #ccd3df}button:disabled{opacity:.65}
h1{font-size:28px;margin:8px 0 10px}.note{margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔐</div>
  <h1>Katrinas Digital Attendance</h1>
  <p class="muted">Back Office Sign In</p>
  <input id="email" type="email" placeholder="Email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="supervisorBtn">🔐 Sign in as Supervisor</button>
  <button id="employerBtn" class="alt">👑 Sign in as Employer</button>
  <button id="signupBtn" class="alt">Create Supervisor Account</button>
  <button id="resendBtn" class="alt">Resend Confirmation Email</button>
  <div id="msg" class="msg small"></div>
  <p class="muted small note">Supervisor = full access. Employer = read-only access.</p>
</div>
<script>
const SUPABASE_URL='https://ktrrjldiniwqryuojjnq.supabase.co';
const SUPABASE_KEY='sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]) )}
async function login(role){
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||!password){$('msg').innerHTML='<span class="bad">Enter email and password.</span>';return}
  const btn=role==='boss'?$('employerBtn'):$('supervisorBtn');
  btn.disabled=true; const old=btn.textContent; btn.textContent='Signing in…';
  $('msg').textContent='Connecting securely…';
  try{
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),12000);
    const res=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({email,password}),
      signal:controller.signal
    });
    clearTimeout(timer);
    const data=await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error_description||data.msg||data.message||'Login failed.');
    const actual=data.user?.user_metadata?.role||'supervisor';
    if(role==='boss'&&actual!=='boss') throw new Error('This account is not an Employer account.');
    if(role==='supervisor'&&actual==='boss') throw new Error('This account is the Employer account. Use “Sign in as Employer”.');
    if(!data.access_token||!data.refresh_token) throw new Error('Login succeeded but no secure session was returned.');
    sessionStorage.setItem('kda_pending_access_token',data.access_token);
    sessionStorage.setItem('kda_pending_refresh_token',data.refresh_token);
    $('msg').innerHTML='<span class="ok">✅ Login successful. Opening Back Office…</span>';
    location.replace('./index.html?login=1');
  }catch(e){
    const msg=e.name==='AbortError'?'Connection timed out. Please check your internet and try again.':(e.message||String(e));
    $('msg').innerHTML='<span class="bad">❌ '+safe(msg)+'</span>';
    btn.disabled=false;btn.textContent=old;
  }
}
$('supervisorBtn').onclick=()=>login('supervisor');
$('employerBtn').onclick=()=>login('boss');
$('signupBtn').onclick=async()=>{
  const email=$('email').value.trim(),password=$('password').value;
  if(!email||password.length<6){$('msg').innerHTML='<span class="bad">Enter email and a password with at least 6 characters.</span>';return}
  $('msg').textContent='Creating account…';
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{role:'supervisor'}}});
  if(error){$('msg').innerHTML='<span class="bad">❌ '+safe(error.message)+'</span>';return}
  $('msg').innerHTML='<span class="ok">✅ Account created. Check your email for confirmation, then sign in.</span>';
};
$('resendBtn').onclick=async()=>{
  const email=$('email').value.trim();
  if(!email){$('msg').innerHTML='<span class="bad">Enter the supervisor email first.</span>';return}
  $('msg').textContent='Sending confirmation email…';
  const {error}=await sb.auth.resend({type:'signup',email});
  $('msg').innerHTML=error?'<span class="bad">❌ '+safe(error.message)+'</span>':'<span class="ok">✅ Confirmation email sent. Check Inbox and Spam/Junk.</span>';
};
(async()=>{const {data}=await sb.auth.getSession();if(data.session)location.replace('./index.html')})();
</script>
</body>
</html>
