Name="bad";m.textContent="Enter email and password.";return}m.textContent="Signing in...";try{const r=await s.auth.signInWithPassword({email,password});if(r.error){m.className="bad";m.textContent="❌ "+r.error.message;return}const q=await s.auth.getSession();if(!q.data.session){m.className="bad";m.textContent="❌ No active session.";return}m.className="ok";m.textContent="✅ LOGIN SUCCESSFUL";document.getElementById("login").style.display="none";document.getElementById("browser").style.display="block";const h={apikey:K,Authorization:"Bearer "+q.data.session.access_token};const [e,b,a]=await Promise.all([fetch(U+"/rest/v1/employees?select=id&active=eq.true",{headers:h}),fetch(U+"/rest/v1/branches?select=id",{headers:{apikey:K,Authorization:"Bearer "+K}}),fetch(U+"/rest/v1/attendance?select=id&attendance_date=eq."+new Date().toISOString().slice(0,10),{headers:h})]);document.getElementById("e").textContent=e.ok?(await e.json()).length:"—";document.getElementById("b").textContent=b.ok?(await b.json()).length:"—";document.getElementById("a").textContent=a.ok?(await a.json()).length:"—"}catch(x){m.className="bad";m.textContent="❌ "+(x.message||x)}};</script></body></html>
