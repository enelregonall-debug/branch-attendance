<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Katrinas Digital Attendance — Supervisor</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}
.card{width:min(430px,90%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 35px #0002;margin:70px auto}
h1{color:#8d1023;margin-top:0}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccd3df;font-size:16px}
button{background:#8d1023;color:#fff;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}.msg{margin-top:14px;padding:10px;border-radius:8px;white-space:pre-wrap}.ok{background:#e8f7ee;color:#087443}.bad{background:#fff0ef;color:#b42318}
#app{display:none}.head{background:linear-gradient(135deg,#8d1023,#b51f32);color:white;padding:20px}.wrap{max-width:1100px;margin:auto}.head h1{color:white;margin:0}.content{padding:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:white;padding:20px;border-radius:14px;border:1px solid #e5e7eb}.stat b{display:block;font-size:30px;margin-top:6px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.content{padding:12px}}
</style>
</head>
<body>
<div id="login" class="card">
<h1>🔐 Supervisor Sign In</h1>
<p>Katrinas Digital Attendance — secure Supervisor access.</p>
<input id="email" type="email" placeholder="Supervisor email" autocomplete="username">
<input id="password" type="password" placeholder="Supervisor password" autocomplete="current-password">
<button id="loginBtn">SIGN IN</button>
<div id="msg" class="msg">Ready.</div>
</div>

<div id="app">
<div class="head"><div class="wrap"><button id="logout" style="float:right;width:auto;background:white;color:#172033;padding:9px 15px">Log Out</button><h1>Katrinas Digital Attendance</h1><div>Supervisor / Back Office</div></div></div>
<div class="content wrap">
<div class="card" style="width:auto;margin:0 0 15px;box-shadow:none"><h2>Dashboard</h2><p id="status">Supervisor login successful.</p></div>
<div class="stats">
<div class="stat">Active Employees<b id="employees">—</b></div>
<div class="stat">Branches<b id="branches">—</b></div>
<div class="stat">Present Today<b id="present">—</b></div>
<div class="stat">Not Yet In<b id="notyet">—</b></div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ktrrjldiniwqryuojjnq.supabase.co";
const SUPABASE_KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const loginBox=document.getElementById("login"),app=document.getElementById("app"),msg=document.getElementById("msg");

function openApp(){
 loginBox.style.display="none";
 app.style.display="block";
}

async function loadDashboard(){
 try{
  const [e,b]=await Promise.all([
   sb.from("employees").select("id,active"),
   sb.from("branches").select("id")
  ]);
  if(e.error||b.error)throw(e.error||b.error);
  const active=(e.data||[]).filter(x=>x.active!==false).length;
  document.getElementById("employees").textContent=active;
  document.getElementById("branches").textContent=(b.data||[]).length;
  const d=new Date(),date=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const a=await sb.from("attendance").select("employee_id").eq("attendance_date",date);
  if(a.error)throw a.error;
  const present=new Set((a.data||[]).map(x=>x.employee_id)).size;
  document.getElementById("present").textContent=present;
  document.getElementById("notyet").textContent=Math.max(0,active-present);
 }catch(e){
  console.error(e);
  document.getElementById("status").textContent="Dashboard opened. Some counts could not load yet.";
 }
}

document.getElementById("loginBtn").onclick=async()=>{
 const btn=document.getElementById("loginBtn");
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){msg.className="msg bad";msg.textContent="Enter email and password.";return}
 btn.disabled=true;msg.className="msg";msg.textContent="Signing in...";
 try{
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){msg.className="msg bad";msg.textContent="LOGIN FAILED\n"+error.message;return}
  if(!data.session){msg.className="msg bad";msg.textContent="Login returned but no active session was created.";return}
  msg.className="msg ok";msg.textContent="✅ LOGIN SUCCESSFUL";
  openApp();
  loadDashboard();
 }catch(e){msg.className="msg bad";msg.textContent="ERROR\n"+(e.message||e)}
 finally{btn.disabled=false}
};

document.getElementById("logout").onclick=async()=>{await sb.auth.signOut();location.reload()};

(async()=>{
 try{
  const {data}=await sb.auth.getSession();
  if(data.session){openApp();loadDashboard()}
 }catch(e){console.error(e)}
})();
</script>
</body>
</html>
