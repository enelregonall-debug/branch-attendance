<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Katrinas Digital Attendance — Employee</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6fb;margin:0;color:#172033}.wrap{max-width:560px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0001;margin-top:25px}h1{font-size:23px;margin:0 0 6px}h2{font-size:19px}select,button{width:100%;padding:14px;border-radius:10px;border:1px solid #ccd3df;font-size:16px;box-sizing:border-box;margin-top:10px}button{background:#172033;color:white;border:0;font-weight:700}.secondary{background:white;color:#172033;border:1px solid #ccd3df}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#f5f7fa}.ok{color:#087443}.bad{color:#b42318}.muted{color:#667085}.big{font-size:18px;font-weight:700}.hidden{display:none}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>📍 Katrinas Digital Attendance</h1>
<p id="branch" class="big">Checking branch…</p>
<p class="muted">Employee attendance — branch restricted with GPS</p>
<div id="setup">
<label><b>Select your name</b></label>
<select id="employee"><option>Loading employees…</option></select>
<button onclick="registerPhone()">Register This Phone</button>
<button class="secondary" onclick="loadData()">Refresh</button>
</div>
<div id="attendance" class="hidden">
<p id="selected" class="big"></p>
<button onclick="attendance('in')">✅ TIME IN</button>
<button onclick="attendance('out')">⏰ TIME OUT</button>
<button class="secondary" onclick="changeEmployee()">Change Employee / Phone</button>
</div>
<div id="msg" class="msg">Starting…</div>
</div></div>
<script>
const API='https://ktrrjldiniwqryuojjnq.supabase.co/rest/v1';
const KEY='sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK'; 
const qs=new URLSearchParams(location.search);
const branchId=qs.get('branchId'), token=qs.get('branch');
let branch=null, employees=[], busy=false;
const BKEY='kda_clean_branch_v1', EKEY='kda_clean_employees_v1', PKEY='kda_clean_phone_v1', QKEY='kda_clean_queue_v1';
function msg(s,good=false){const m=document.getElementById('msg');m.className='msg '+(good?'ok':'bad');m.textContent=s}
function successConfirm(type,e){
  const title=type==='in'?'TIME IN SUCCESSFUL':'TIME OUT SUCCESSFUL';
  const icon=type==='in'?'✅':'🕐';
  const now=new Date();
  const time=now.toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit',second:'2-digit'});
  const box=document.createElement('div');
  box.style='position:fixed;inset:0;background:#0008;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  box.innerHTML='<div style="background:white;border-radius:18px;padding:25px;max-width:400px;width:100%;text-align:center;box-shadow:0 12px 40px #0004"><div style="font-size:48px">'+icon+'</div><h2 style="margin:8px 0">'+title+'</h2><p style="font-size:18px;font-weight:700;margin:8px 0">'+esc(e.full_name)+'</p><p class="muted">'+esc(branch.name)+'</p><p style="margin:8px 0">Recorded: <b>'+time+'</b></p><button id="successOk" style="width:100%;padding:14px;border:0;border-radius:10px;background:#172033;color:white;font-size:16px;font-weight:700">OK</button></div>';
  document.body.appendChild(box);
  document.getElementById('successOk').onclick=()=>box.remove();
}
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok){let x='HTTP '+r.status;try{const j=await r.json();x=j.message||j.details||x}catch{};throw Error(x)}return r}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function dist(a,b,c,d){const R=6371000,p=Math.PI/180,A=(c-a)*p,B=(d-b)*p,x=Math.sin(A/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(B/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function getPos(){return new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000,maximumAge:30000}))}
async function loadData(){
 try{
  if(!branchId&&!token)throw Error('Invalid Branch QR. No branch information found.');
  let r,arr=[];
  if(branchId){r=await api('/branches?id=eq.'+encodeURIComponent(branchId)+'&select=id,name,qr_token,latitude,longitude,radius_m');arr=await r.json()}
  if(!arr.length&&token){r=await api('/branches?qr_token=eq.'+encodeURIComponent(token)+'&select=id,name,qr_token,latitude,longitude,radius_m');arr=await r.json()}
  if(!arr.length)throw Error('Branch QR could not be verified.');
  branch=arr[0];localStorage.setItem(BKEY,JSON.stringify(branch));
  document.getElementById('branch').textContent='Branch: '+branch.name;
  r=await api('/employees?active=eq.true&or=(branch_id.eq.'+Number(branch.id)+',branch_id.is.null)&select=id,employee_code,full_name,position,branch_id&order=full_name.asc');
  employees=await r.json();localStorage.setItem(EKEY,JSON.stringify(employees));
  if(!employees.length)throw Error('No active employees are assigned to this branch.');
  const sel=document.getElementById('employee');sel.innerHTML='<option value="">Select your name</option>'+employees.map(e=>'<option value="'+esc(e.employee_code)+'">'+esc(e.full_name)+' — '+esc(e.employee_code)+'</option>').join('');
  const bind=JSON.parse(localStorage.getItem(PKEY)||'null');
  if(bind){showAttendance(bind);msg('This phone is registered to '+bind.full_name+'.',true)}else{document.getElementById('setup').classList.remove('hidden');msg('Select your name to register this phone.',true)}
 }catch(e){msg('❌ '+e.message)}
}
function showAttendance(e){document.getElementById('setup').classList.add('hidden');document.getElementById('attendance').classList.remove('hidden');document.getElementById('selected').textContent=e.full_name+' — '+e.employee_code}
function changeEmployee(){localStorage.removeItem(PKEY);location.reload()}
async function registerPhone(){if(busy)return;const code=document.getElementById('employee').value,e=employees.find(x=>x.employee_code===code);if(!e){msg('Please select your name first.');return}localStorage.setItem(PKEY,JSON.stringify({id:e.id,employee_code:e.employee_code,full_name:e.full_name,branch_id:e.branch_id}));showAttendance(e);msg('Phone registered. You can now record attendance.',true)}
async function inside(){if(!branch.latitude||!branch.longitude)throw Error('Branch GPS location is not set yet. Ask the Supervisor to set it.');const p=await getPos(),d=dist(p.coords.latitude,p.coords.longitude,Number(branch.latitude),Number(branch.longitude));if(d>Number(branch.radius_m||75))throw Error('You are outside '+branch.name+'. Attendance is allowed only inside the branch.');return d}
async function attendance(type){if(busy)return;busy=true;try{const e=JSON.parse(localStorage.getItem(PKEY)||'null');if(!e)throw Error('Register this phone first.');if(Number(e.branch_id)!==Number(branch.id)&&e.branch_id!=null)throw Error('This employee is not assigned to this branch.');await inside();const date=today();const r=await api('/attendance?employee_id=eq.'+encodeURIComponent(e.id)+'&attendance_date=eq.'+date+'&select=id,time_in,time_out');const rows=await r.json();const now=new Date().toISOString();if(type==='in'){if(rows[0]?.time_in)throw Error('TIME IN already recorded today.');const x=await api('/attendance',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({employee_id:e.id,branch_id:branch.id,attendance_date:date,time_in:now})});if(!x.ok)throw Error('Could not save TIME IN.')}else{if(new Date().getHours()<12)throw Error('TIME OUT is locked until 12:00 PM.');if(!rows[0]?.time_in)throw Error('No TIME IN found for today.');if(rows[0].time_out)throw Error('TIME OUT already recorded today.');await api('/attendance?id=eq.'+rows[0].id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({time_out:now})})}msg('✅ '+type.toUpperCase()+' recorded successfully for '+e.full_name+'.',true); successConfirm(type,e)}catch(e){msg('❌ '+e.message)}finally{busy=false}}
loadData();
</script></body></html>
