<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Katrinas Digital Attendance</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fb;font-family:"Book Antiqua",Palatino,serif;color:#172033;padding:20px}
.box{width:min(430px,100%);background:#fff;padding:28px;border-radius:18px;border:1px solid #e6eaf0;box-shadow:0 20px 50px rgba(23,32,51,.16)}
h1{margin:0 0 8px;color:#8d1023;font-size:28px}h2{margin:0 0 8px}p{color:#667085}
input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;font:inherit}
input{border:1px solid #d7dce5}button{border:0;background:#8d1023;color:#fff;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}.msg{min-height:24px;margin-top:12px}.bad{color:#b42318}.ok{color:#087443}
</style>
</head>
<body>
<div class="box">
<h1>Katrinas Digital Attendance</h1>
<h2>Supervisor Sign In</h2>
<p>Full back-office access.</p>
<input id="email" type="email" placeholder="Supervisor email" autocomplete="username">
<input id="password" type="password" placeholder="Supervisor password" autocomplete="current-password">
<button id="btn">🔐 Sign In as Supervisor</button>
<div id="msg" class="msg"></div>
</div>
<script>
(function(){
const URL="https://ktrrjldiniwqryuojjnq.supabase.co";
const KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK";
const btn=document.getElementById("btn"),msg=document.getElementById("msg");
async function signIn(){
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){msg.innerHTML='<span class="bad">Enter email and password.</span>';return;}
 btn.disabled=true;msg.textContent="Signing in…";
 try{
  const res=await fetch(URL+"/auth/v1/token?grant_type=password",{
   method:"POST",
   headers:{"apikey":KEY,"Content-Type":"application/json"},
   body:JSON.stringify({email:email,password:password})
  });
  const data=await res.json().catch(function(){return{}});
  if(!res.ok) throw new Error(data.error_description||data.msg||data.message||"Invalid login credentials");
  if(!data.access_token) throw new Error("No access token returned.");
  if(data.user&&data.user.user_metadata&&data.user.user_metadata.role==="boss") throw new Error("Please use the Employer Browser for this account.");
  localStorage.setItem("kda_supervisor_token",data.access_token);
  localStorage.setItem("kda_supervisor_user",JSON.stringify(data.user||{}));
  msg.innerHTML='<span class="ok">Login successful. Opening Supervisor Browser…</span>';
  location.href="./supervisor.html?session="+Date.now();
 }catch(e){
  msg.innerHTML='<span class="bad">❌ '+String(e.message||e).replace(/[<>&"']/g,"")+'</span>';
  btn.disabled=false;
 }
}
btn.addEventListener("click",signIn);
document.getElementById("password").addEventListener("keydown",function(e){if(e.key==="Enter")signIn()});
})();
</script>
</body>
</html>
