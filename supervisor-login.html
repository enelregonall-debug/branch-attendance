<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Katrinas Digital Attendance</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f7f8fb,#eef2f7);font-family:"Book Antiqua",Palatino,serif;color:#172033;padding:20px}.box{width:min(430px,100%);background:#fff;border:1px solid #e6eaf0;border-radius:18px;padding:28px;box-shadow:0 20px 50px rgba(23,32,51,.16)}h1{font-size:26px;margin:0 0 6px;color:#8d1023}h2{margin:0 0 8px}p{color:#667085;font-size:14px}input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #d7dce5;font:inherit;margin-top:10px}button{background:#8d1023;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.msg{min-height:24px;margin-top:12px;font-size:14px}.bad{color:#b42318}.ok{color:#087443}</style></head><body><div class="box"><h1>Katrinas Digital Attendance</h1><h2>Supervisor Sign In</h2><p>Full back-office access.</p><input id="email" type="email" placeholder="Supervisor email" autocomplete="username"><input id="password" type="password" placeholder="Supervisor password" autocomplete="current-password"><button id="btn" onclick="signIn()">🔐 Sign In as Supervisor</button><div id="msg" class="msg"></div></div><script>const URL="https://ktrrjldiniwqryuojjnq.supabase.co",KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK";async function signIn(){const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,btn=document.getElementById("btn"),msg=document.getElementById("msg");if(!email||!password){msg.innerHTML='<span class="bad">Please enter email and password.</span>';return}btn.disabled=true;msg.textContent="Signing in…";try{const r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error_description||d.msg||d.message||"Invalid login credentials");if(d.user?.user_metadata?.role==="boss")throw new Error("Please use the Employer login for this account.");if(!d.access_token)throw new Error("No access token returned.");localStorage.setItem("kda_supervisor_token",d.access_token);msg.innerHTML='<span class="ok">Login successful. Opening Supervisor Browser…</span>';location.replace("./supervisor.html?open=3")}catch(e){msg.innerHTML='<span class="bad">❌ '+String(e.message||e).replace(/[<>&"']/g,"")+'</span>';btn.disabled=false}}document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});</script></body></html>
