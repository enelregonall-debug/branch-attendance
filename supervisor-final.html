<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katrinas Digital Attendance — Supervisor</title>
<style>
:root{--red:#8d1023;--red2:#b51f32;--ink:#172033;--muted:#667085;--line:#e6eaf0;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;font-family:"Book Antiqua",Palatino,Georgia,serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:20px;position:sticky;top:0;z-index:20}header h2{margin:0}header button{float:right;background:#fff;color:var(--ink)}
nav{position:sticky;top:77px;z-index:19;background:#fff;border-bottom:1px solid var(--line);padding:10px;display:flex;gap:7px;flex-wrap:wrap}nav button{width:auto}
main{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 8px 24px #1720330d}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.stat{font-size:28px;font-weight:800}
button,input,select{font:inherit;padding:10px 12px;border:1px solid #d5dae3;border-radius:9px}button{background:var(--ink);color:#fff;cursor:pointer;font-weight:700}button.secondary{background:#fff;color:var(--ink)}button.danger{background:#fff;color:#b42318;border-color:#e2a0a0}input,select{width:100%}label{font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left}th{background:#f7f8fb;font-size:12px;position:sticky;top:137px;z-index:3}.scroll{overflow:auto}.muted{color:var(--muted)}.ok{color:#087443;font-weight:700}.bad{color:#b42318;font-weight:700}
.hidden{display:none!important}#login{position:fixed;inset:0;background:linear-gradient(135deg,#eef2f7,#fafbfc);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
.loginbox{width:min(430px,100%);background:#fff;padding:25px;border-radius:16px;border:1px solid var(--line);box-shadow:0 20px 50px #17203322}.loginbox input,.loginbox button{margin:6px 0}.msg{min-height:20px;margin-top:8px}
@media(max-width:700px){header{padding:15px}nav{top:69px}main{padding:10px}.card{padding:14px}th{top:117px}}
</style></head><body>
<div id="login"><div class="loginbox"><h2>Katrinas Digital Attendance</h2><h3>Supervisor Sign In</h3><input id="email" type="email" placeholder="Supervisor email"><input id="password" type="password" placeholder="Supervisor password"><button onclick="signIn()" id="loginBtn">🔐 Sign In</button><div id="loginMsg" class="msg muted"></div></div></div>
<header id="head" class="hidden"><button onclick="logout()">Log Out</button><h2>Katrinas Digital Attendance</h2><div>Supervisor Browser</div></header>
<nav id="nav" class="hidden"><button onclick="page('dashboard')">Dashboard</button><button onclick="page('employees')">Employees</button><button onclick="page('qr')">🏪 Branch QR</button><button onclick="page('attendance')">Attendance</button><button onclick="page('summary')">📊 Monthly Summary</button><button onclick="page('customize')">⚙️ Customize</button></nav>
<main id="app" class="hidden"></main>
<script>
const URL="https://ktrrjldiniwqryuojjnq.supabase.co",KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK",API=URL+"/rest/v1";let token="",branches=[],employees=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}function month(){return today().slice(0,7)}function money(n){return"₱"+Number(n||0).toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2)}}
function msg(x,c="muted"){let e=document.getElementById("loginMsg");e.className="msg "+c;e.textContent=x}
async function auth(email,password){let r=await fetch(URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({email,password})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error_description||d.msg||"Invalid login credentials.");if(d.user?.user_metadata?.role==="boss")throw Error("Please use the Employer Browser for the Employer account.");return d}
async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{apikey:KEY,Authorization:"Bearer "+token,Accept:"application/json",...(opt.headers||{})}}),t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.details||d?.hint||("HTTP "+r.status));return d}
async function loadBase(){[branches,employees]=await Promise.all([api("/branches?select=id,name,latitude,longitude,radius_meters&order=id.asc"),api("/employees?select=id,employee_code,full_name,position,branch_id,daily_rate,active&order=full_name.asc")])}
async function signIn(){let e=document.getElementById("email").value.trim(),p=document.getElementById("password").value,b=document.getElementById("loginBtn");if(!e||!p)return msg("Enter your email and password.","bad");b.disabled=true;msg("Signing in…");try{const d=await auth(e,p);token=d.access_token;document.getElementById("login").classList.add("hidden");document.getElementById("head").classList.remove("hidden");document.getElementById("nav").classList.remove("hidden");document.getElementById("app").classList.remove("hidden");msg("");try{await loadBase();await page("dashboard")}catch(dataErr){document.getElementById("app").innerHTML='<div class="card"><h2>Dashboard</h2><p class="bad">Login successful, but the Supervisor data could not be loaded.</p><p>'+esc(dataErr.message||dataErr)+'</p><button onclick="retryData()">Retry</button></div>'}}catch(x){token="";msg(x.message||"Login failed.","bad")}finally{b.disabled=false}}
async function retryData(){try{await loadBase();await page("dashboard")}catch(e){document.getElementById("app").innerHTML='<div class="card"><span class="bad">'+esc(e.message)+'</span><p><button onclick="retryData()">Retry</button></p></div>'}}\nfunction bname(id){return branches.find(b=>String(b.id)===String(id))?.name||"—"}
async function page(p){const app=document.getElementById("app");app.innerHTML='<div class="card">Loading…</div>';try{if(p==="dashboard")return dashboard();if(p==="employees")return employeePage();if(p==="qr")return qrPage();if(p==="attendance")return attendancePage();if(p==="summary")return summaryPage();if(p==="customize")return customizePage()}catch(e){app.innerHTML='<div class="card"><span class="bad">'+esc(e.message)+'</span><p><button onclick="page(\''+p+'\')">Retry</button></p></div>'}}
async function dashboard(){const app=document.getElementById("app");let r=await api("/attendance?attendance_date=eq."+today()+"&select=id,time_in,time_out,branch_id");app.innerHTML='<div class="card"><h2>Dashboard</h2><div class="grid"><div class="card">Active Employees<div class="stat">'+employees.filter(e=>e.active!==false).length+'</div></div><div class="card">Attendance Today<div class="stat">'+r.length+'</div></div><div class="card">Timed In<div class="stat">'+r.filter(x=>x.time_in&&!x.time_out).length+'</div></div><div class="card">Completed<div class="stat">'+r.filter(x=>x.time_in&&x.time_out).length+'</div></div></div></div><div class="card"><b>System Status</b><p class="ok">● Connected</p><p class="muted">'+branches.length+' branches loaded.</p></div>'}
function employeePage(){const app=document.getElementById("app");app.innerHTML='<div class="card"><h2>Employees</h2><div class="grid"><input id="ef" placeholder="Search employee…" oninput="renderEmployees()"><select id="eb" onchange="renderEmployees()"><option value="all">All Branches</option>'+branches.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join("")+'</select><button onclick="newEmployee()">➕ Add Employee</button></div><div class="scroll" id="etable"></div></div>';renderEmployees()}
function renderEmployees(){let f=ef?.value.toLowerCase()||"",b=eb?.value||"all",rows=employees.filter(e=>(e.full_name+" "+(e.employee_code||"")).toLowerCase().includes(f)&&(b==="all"||String(e.branch_id)===b));etable.innerHTML='<table><tr><th>EMP ID</th><th>NAME</th><th>POSITION</th><th>BRANCH</th><th>DAILY RATE</th><th>ACTION</th></tr>'+rows.map(e=>'<tr><td>'+esc(e.employee_code)+'</td><td>'+esc(e.full_name)+'</td><td>'+esc(e.position)+'</td><td>'+esc(bname(e.branch_id))+'</td><td>'+money(e.daily_rate)+'</td><td><button onclick="editEmployee('+e.id+')">Edit</button> <button class="danger" onclick="removeEmployee('+e.id+')">Delete</button></td></tr>').join("")+'</table><p class="muted">'+rows.length+' employee(s)</p>'}
async function newEmployee(){let name=prompt("Employee full name:");if(!name)return;let position=prompt("Position:")||"",rate=Number(prompt("Daily rate:")||0),br=prompt("Branch ID (blank = Any Branch):")||null,max=Math.max(0,...employees.map(e=>Number((e.employee_code||"").replace(/\D/g,""))));try{await api("/employees",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({employee_code:"EMP-"+String(max+1).padStart(3,"0"),full_name:name,position,daily_rate:rate,branch_id:br?Number(br):null,active:true})});await loadBase();employeePage()}catch(e){alert(e.message)}}
async function editEmployee(id){let e=employees.find(x=>x.id==id);if(!e)return;let name=prompt("Name:",e.full_name);if(name===null)return;let pos=prompt("Position:",e.position||"");if(pos===null)pos=e.position||"";let rate=Number(prompt("Daily rate:",e.daily_rate||0));try{await api("/employees?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({full_name:name,position:pos,daily_rate:rate})});await loadBase();employeePage()}catch(x){alert(x.message)}}
async function removeEmployee(id){let e=employees.find(x=>x.id==id);if(!confirm("Delete "+e.full_name+"?"))return;try{await api("/employees?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});await loadBase();employeePage()}catch(x){alert(x.message)}}
function qrPage(){const app=document.getElementById("app");app.innerHTML='<div class="card"><h2>🏪 Branch QR</h2><p class="muted">Each branch has its own attendance QR.</p><div class="grid">'+branches.map(b=>{let u=location.origin+location.pathname.replace(/[^/]*$/,"")+"attendance.html?branchName="+encodeURIComponent(b.name);return'<div class="card"><h3>'+esc(b.name)+'</h3><img style="width:180px;height:180px" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data='+encodeURIComponent(u)+'"><p class="small">'+esc(u)+'</p><button onclick="window.open('+JSON.stringify(u)+')">Open</button></div>'}).join("")+'</div></div>'}
async function attendancePage(){const app=document.getElementById("app");let m=document.getElementById("am")?.value||month(),b=document.getElementById("ab")?.value||"all",parts=m.split("-"),last=new Date(Number(parts[0]),Number(parts[1]),0).getDate(),r=await api("/attendance?attendance_date=gte."+m+"-01&attendance_date=lte."+m+"-"+String(last).padStart(2,"0")+"&select=id,employee_id,branch_id,attendance_date,time_in,time_out&order=attendance_date.desc,time_in.desc&limit=5000");r=b==="all"?r:r.filter(x=>String(x.branch_id)===b);app.innerHTML='<div class="card"><h2>Attendance Log</h2><div class="grid"><label>Month<input id="am" type="month" value="'+m+'" onchange="attendancePage()"></label><label>Branch<select id="ab" onchange="attendancePage()"><option value="all">All Branches</option>'+branches.map(x=>'<option value="'+x.id+'" '+(String(x.id)===b?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></label></div><p><button onclick="manual()">📝 Manual Attendance</button> <button onclick="exportAttendance()">Export CSV</button></p><div class="scroll"><table><tr><th>DATE</th><th>EMP ID</th><th>NAME</th><th>BRANCH</th><th>TIME IN</th><th>TIME OUT</th><th>ACTION</th></tr>'+r.map(x=>{let e=employees.find(q=>q.id===x.employee_id);return'<tr><td>'+x.attendance_date+'</td><td>'+esc(e?.employee_code)+'</td><td>'+esc(e?.full_name)+'</td><td>'+esc(bname(x.branch_id))+'</td><td>'+fmtTime(x.time_in)+'</td><td>'+fmtTime(x.time_out)+'</td><td><button class="danger" onclick="delAtt('+x.id+')">Delete</button></td></tr>'}).join("")+'</table></div></div>'}
function fmtTime(v){return v?new Date(v).toLocaleTimeString("en-PH",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:"Asia/Manila"}):"—"}
async function delAtt(id){if(!confirm("Delete this attendance record? This cannot be undone."))return;try{await api("/attendance?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});attendancePage()}catch(e){alert(e.message)}}
async function manual(){let list=employees.filter(e=>e.active!==false).map(e=>e.id+" — "+e.full_name).join("\n"),id=prompt("Employee ID number:\n\n"+list);if(!id)return;let e=employees.find(x=>String(x.id)===String(id));if(!e)return alert("Employee not found.");let date=prompt("Date (YYYY-MM-DD):",today()),tin=prompt("Time In (HH:MM):","08:00"),tout=prompt("Time Out (HH:MM):","17:00");if(!date||!tin||!tout)return;let bid=e.branch_id;if(bid==null){let s=prompt("Any Branch employee. Enter actual Branch ID:\n"+branches.map(b=>b.id+" — "+b.name).join("\n"));if(!s)return;bid=Number(s)}try{let old=await api("/attendance?employee_id=eq."+e.id+"&attendance_date=eq."+date+"&select=id"),payload={employee_id:e.id,branch_id:bid,attendance_date:date,time_in:new Date(date+"T"+tin).toISOString(),time_out:new Date(date+"T"+tout).toISOString()};if(old[0])await api("/attendance?id=eq."+old[0].id,{method:"PATCH",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(payload)});else await api("/attendance",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(payload)});alert("Manual attendance saved.");attendancePage()}catch(x){alert(x.message)}}
async function exportAttendance(){let table=document.querySelector("#app table");if(!table)return;let csv=[...table.rows].map(r=>[...r.cells].slice(0,-1).map(c=>JSON.stringify(c.innerText)).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="attendance-"+(document.getElementById("am")?.value||month())+".csv";a.click()}
async function summaryPage(){const app=document.getElementById("app");let m=document.getElementById("sm")?.value||month(),b=document.getElementById("sb")?.value||"all",parts=m.split("-"),last=new Date(Number(parts[0]),Number(parts[1]),0).getDate(),att=await api("/attendance?attendance_date=gte."+m+"-01&attendance_date=lte."+m+"-"+String(last).padStart(2,"0")+"&select=employee_id,attendance_date,time_in,time_out,branch_id"),es=employees.filter(e=>e.active!==false&&(b==="all"||String(e.branch_id)===b)),cur=month(),td=today();let rows=es.map(e=>{let ar=att.filter(x=>x.employee_id===e.id),present=ar.filter(x=>x.time_in).length,elapsed=m<cur?31:m>cur?0:Number(td.slice(8)),half=ar.filter(x=>x.time_in&&(new Date(x.time_in).getHours()>=12||(x.time_out&&new Date(x.time_out).getHours()===13))).length,eq=Math.max(0,present-half*.5),absent=Math.max(0,elapsed-eq);return{e,eq,absent,pay:eq*Number(e.daily_rate||0)}});app.innerHTML='<div class="card"><h2>📊 Monthly Attendance Summary</h2><div class="grid"><label>Month<input id="sm" type="month" value="'+m+'" onchange="summaryPage()"></label><label>Branch<select id="sb" onchange="summaryPage()"><option value="all">All Branches</option>'+branches.map(x=>'<option value="'+x.id+'" '+(String(x.id)===b?"selected":"")+'>'+esc(x.name)+'</option>').join("")+'</select></label></div><p class="muted">31-day payroll basis. Future dates are not counted. Halfday = 0.5. Total Hours is excluded.</p><div class="scroll"><table><tr><th>EMP ID</th><th>NAME</th><th>BRANCH</th><th>DAILY RATE</th><th>PRESENT</th><th>ABSENT</th><th>ESTIMATED PAY</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.e.employee_code)+'</td><td>'+esc(r.e.full_name)+'</td><td>'+esc(bname(r.e.branch_id))+'</td><td>'+money(r.e.daily_rate)+'</td><td class="ok">'+r.eq.toFixed(r.eq%1?1:0)+'</td><td class="bad">'+r.absent.toFixed(r.absent%1?1:0)+'</td><td><b>'+money(r.pay)+'</b></td></tr>').join("")+'</table></div></div>'}
function customizePage(){const app=document.getElementById("app");app.innerHTML='<div class="card"><h2>⚙️ Customize</h2><div class="grid"><label>Theme<select onchange="theme(this.value)"><option>Red Classic</option><option>Navy</option><option>Green</option><option>Dark</option></select></label><label>Font<select onchange="font(this.value)"><option>Book Antiqua</option><option>Georgia</option><option>Arial</option></select></label></div></div>'}
function theme(x){document.documentElement.style.setProperty("--red",x==="Navy"?"#172033":x==="Green"?"#174d3b":x==="Dark"?"#111":"#8d1023");document.documentElement.style.setProperty("--red2",x==="Navy"?"#263451":x==="Green"?"#236b52":x==="Dark"?"#333":"#b51f32")}function font(x){document.body.style.fontFamily=x+",Georgia,serif"}function logout(){token="";location.reload()}
password.addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});
</script></body></html>
