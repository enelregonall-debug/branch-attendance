<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katrinas Digital Attendance — Supervisor Login Test</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(420px,90%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 35px #0002}
h1{margin-top:0;color:#8d1023}input,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:10px;border:1px solid #ccd3df;font-size:16px}button{background:#8d1023;color:#fff;border:0;font-weight:bold;cursor:pointer}.msg{margin-top:14px;padding:10px;border-radius:8px;white-space:pre-wrap}.ok{background:#e8f7ee;color:#087443}.bad{background:#fff0ef;color:#b42318}.muted{color:#667085;font-size:14px}
</style>
</head>
<body>
<div class="card">
<h1>🔐 Supervisor Login</h1>
<p class="muted">Fresh login test only. No Dashboard or Attendance code is loaded here.</p>
<input id="email" type="email" placeholder="Supervisor email" autocomplete="username">
<input id="password" type="password" placeholder="Supervisor password" autocomplete="current-password">
<button id="login">SIGN IN</button>
<div id="msg" class="msg">Ready.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ktrrjldiniwqryuojjnq.supabase.co";
const SUPABASE_KEY="sb_publishable_EGj6dcFvsXj55qqs8X7lig__P2cHEjK";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const msg=document.getElementById("msg");
document.getElementById("login").onclick=async()=>{
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 if(!email||!password){msg.className="msg bad";msg.textContent="Enter email and password.";return}
 msg.className="msg";msg.textContent="Signing in...";
 try{
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){msg.className="msg bad";msg.textContent="LOGIN FAILED\n"+error.message;return}
  const {data:check}=await sb.auth.getSession();
  if(check.session){
   msg.className="msg ok";
   msg.textContent="✅ LOGIN SUCCESSFUL\n\nSupabase session is working.\nAccount: "+(check.session.user.email||email);
  }else{
   msg.className="msg bad";msg.textContent="Login returned but no session was created.";
  }
 }catch(e){msg.className="msg bad";msg.textContent="ERROR\n"+(e.message||e)}
};
</script>
</body>
</html>
